<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safra · Recuperação Comercial</title>
<style>
:root{--bg:#fff;--canvas:#fafafb;--line:#d9dbe3;--line2:#eceef3;--t1:#0f1222;--t2:#3a3f55;--t3:#6b7086;--t4:#9a9fb3;--blue:#3152f2;--blue2:#2440d0;--blue-soft:#e9edff;--lav:#a9afd6;--lav2:#d6daf0;--red:#d63b30;--orange:#dc7a2a;--green:#4e9f6f;--green2:#2f8a55;--amber:#f2b33d;--navy:#0e2a5a}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Inter Variable",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t1);background:var(--bg);font-size:13.5px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace}.grow{flex:1}.mut{color:var(--t3)}.row{display:flex;gap:8px;align-items:center}.wrapr{flex-wrap:wrap}.small{font-size:12px}
.g{display:grid;gap:8px}
/* workspace chrome (01) */
.ws{min-width:1280px;padding:0 12px 96px}
.ws-head{display:flex;align-items:flex-end;gap:16px;padding:10px 4px}
.ws-head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.ws-head p{margin:2px 0 0;font-size:13px;color:var(--t3)}
.crumb{font-size:12px;color:var(--t3);text-decoration:none;background:none;border:0;padding:0}.crumb:hover{color:var(--blue);text-decoration:underline}
.me{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line)}
.me .av{width:34px;height:34px;border-radius:50%;background:#13182e;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:650;flex:none}
.me b{display:block;font-size:13px}.me span{font-size:11.5px;color:var(--t3)}
.livebtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid #c9ccd8;border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--t2)}
.livebtn i{width:9px;height:9px;border-radius:50%;background:var(--t4)}
.livebtn.on{color:var(--green2);border-color:#bfe3cc;background:#f4fbf6}
.livebtn.on i{background:var(--green);animation:pulse 1.6s infinite}
.livebtn .num{color:var(--t3);font-weight:500}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(78,159,111,.5)}100%{box-shadow:0 0 0 8px rgba(78,159,111,0)}}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);padding:0 10px;align-items:flex-end;margin-bottom:10px}
.tabs button{border:0;background:transparent;padding:11px 0 9px;font-size:13.5px;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:7px;align-items:center}
.tabs button.on{color:var(--t1);font-weight:600;border-bottom-color:var(--blue)}
.tabs .cnt{background:var(--blue);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:650}
.note{display:flex;gap:8px;align-items:center;font-size:12.3px;color:#6b4a06;background:#fff8e6;border:1px solid #f0d58a;border-radius:5px;padding:5px 10px;margin:0 4px 10px}
.note b{color:#5a3d03}
/* surfaces */
.card{background:#fff;border:1px solid var(--line);border-radius:5px;padding:14px 16px;min-width:0}
.card.np{padding:0}
.sh2{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sh2 h3{margin:0;font-size:15.5px;font-weight:700}
.sh2 p{margin:2px 0 0;font-size:12.5px;color:var(--t3)}
.cci-lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:650;margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}
.seg button{border:0;background:transparent;border-radius:4px;padding:4px 12px;font-size:12.5px;color:var(--t2)}
.seg button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none;padding:3px 0}
.toggle{width:38px;height:22px;border-radius:999px;background:#d8dbe6;border:0;position:relative;padding:0;flex:none;transition:background 150ms}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left 150ms}
.toggle.on{background:var(--blue)}.toggle.on::after{left:19px}
/* KPI cards */
.ikpis{display:grid;gap:8px}
.ikpi{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:14px 16px;cursor:pointer;text-align:left}
.ikpi:hover{border-color:#b6bfe9}.ikpi.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.ikpi.static{cursor:default}.ikpi.static:hover{border-color:var(--line)}
.ikpi .ic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.ikpi span{display:block;font-size:12.5px;color:var(--t2)}
.ikpi b{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.ikpi .vrow{display:flex;align-items:baseline;gap:8px}
.ikpi small{font-size:11.5px;color:var(--t3);display:block}
.ikpi .dl{font-size:11.5px;font-weight:600;display:inline;color:var(--green2)}
.ic-blue{background:var(--blue-soft);color:var(--blue)}.ic-red{background:#fdeeed;color:var(--red)}.ic-green{background:#ecf7f0;color:var(--green2)}.ic-amber{background:#fff4e0;color:#b8741a}.ic-violet{background:#f1ecff;color:#6b4fd8}
/* pipe */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pstage{text-align:left;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.pstage:hover:not(:disabled){border-color:#b6bfe9}
.pstage:disabled{cursor:default;background:#f7fbf8}
.pstage.on{border-color:var(--blue);background:#f5f7ff;box-shadow:inset 0 0 0 1px var(--blue)}
.pstage .pn{font-size:12.5px;color:var(--t2);font-weight:600}
.pstage b{font-size:26px;font-weight:500;line-height:1.15}
.pstage small{font-size:11.5px;color:var(--t3)}.pstage small.bad{color:var(--red);font-weight:600}
.pbar{display:block;height:6px;background:#eceef4;border-radius:3px;overflow:hidden;margin:2px 0 3px}
.pbar em{display:block;height:100%;background:#a9b6f5;border-radius:3px}
/* tags, pills, buttons */
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:550;white-space:nowrap;line-height:1.6}
.t-blue{background:var(--blue-soft);color:var(--blue2)}.t-red{background:#fdeeed;color:#b3261e}.t-green{background:#ecf7f0;color:#1f6e43}.t-amber{background:#fff4e0;color:#8a5208}.t-violet{background:#f1ecff;color:#5a3fc4}.t-grey{background:#eef0f4;color:var(--t2)}.t-teal{background:#e4f5f5;color:#13696b}
.tag.selo{font-size:10.5px;padding:0 6px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:500;color:#fff;white-space:nowrap}
.p-green{background:var(--green)}.p-grey{background:#e7e8ee;color:var(--t2)}.p-lav{background:var(--lav2);color:#2b3060}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:3px;padding:1px 5px;border:1px solid}
.kind.regra{color:#1f6e43;border-color:#bfe3cc;background:#f4fbf6}.kind.modelo{color:#8a5208;border-color:#f0d58a;background:#fffaf0}.kind.ia{color:#5a3fc4;border-color:#d4c8f5;background:#f7f3ff}.kind.sint{color:var(--t2);border-color:var(--line);background:#f4f5f8}
.btn{height:30px;padding:0 12px;border:1px solid #c9ccd8;background:#fff;border-radius:4px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:#f4f5f9}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.btn.pri:hover:not(:disabled){background:var(--blue2)}
.btn.danger{color:#b3261e;border-color:#efc3bf}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:26px;font-size:12.5px;padding:0 9px}.btn.lg{height:38px;padding:0 16px;font-size:14px}.btn.wide{width:100%;justify-content:center}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:30px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border:1px solid #c9ccd8;border-radius:5px;background:#fff;font-size:13px}
.chip:hover{background:#f4f5f9}.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue2);font-weight:600}
.chip .x{color:var(--t3);margin-left:2px}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
.t th{text-align:left;font-weight:650;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;font-size:12.5px}
.t th.sortable{cursor:pointer}.t th.sortable:hover{color:var(--blue)}
.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.t td.wrap{white-space:normal}
.t th.r,.t td.r{text-align:right}
.t tbody tr{cursor:pointer}.t tbody tr:hover td{background:#f6f7fb}
.t tr.gh td{background:#f7f8fb;font-weight:650;font-size:12px;color:var(--t2);cursor:default}
.t tr.gh:hover td{background:#f7f8fb}
.t td small{display:block;color:var(--t3);font-size:11.5px}
.t input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
.pscore{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.empty{padding:34px 14px;text-align:center;color:var(--t3)}
.empty b{display:block;color:var(--t2);font-size:14px;margin-bottom:4px}
/* drawer, kv, nba */
.drawer-back{position:fixed;inset:0;background:rgba(15,18,34,.25);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100vw;background:#fff;z-index:90;box-shadow:-8px 0 30px rgba(0,0,0,.14);display:flex;flex-direction:column;animation:slin 170ms ease-out}
@keyframes slin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:16px}
.drawer .body{padding:14px 18px 24px;overflow:auto;flex:1}
.drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafafc;flex-wrap:wrap}
.xbtn{margin-left:auto;width:30px;height:30px;border:0;background:transparent;border-radius:6px;font-size:20px;color:var(--t2)}.xbtn:hover{background:#eef0f5}
.kv{display:grid;grid-template-columns:150px 1fr;gap:0;font-size:13px;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.kv>div{padding:6px 10px;border-bottom:1px solid var(--line2)}
.kv>div:nth-child(odd){color:var(--t3);background:#fafbfd}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:650;margin:16px 0 8px}
.nba{border:1px solid #c9d2ff;background:#f5f7ff;border-radius:7px;padding:12px 14px}
.nba h4{margin:0 0 4px;color:var(--blue2);font-size:14.5px;display:flex;align-items:center;gap:7px}
.wbar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:12.8px;margin:7px 0}
.wbar i{display:block;height:8px;border-radius:4px;background:#eceef4;position:relative;overflow:hidden}
.wbar i em{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.wbar b{text-align:right;font-variant-numeric:tabular-nums}
.sig{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.8px}
.sig:last-child{border-bottom:0}
.sig i{width:9px;height:9px;border-radius:50%;margin-top:5px}.sig i.ok{background:var(--green)}.sig i.no{background:#fff;border:2px solid var(--t4)}.sig i.warn{background:var(--amber)}.sig i.bad{background:var(--red)}
.callout{border:1px solid var(--line);border-left:3px solid var(--blue);background:#f7f8ff;border-radius:4px;padding:9px 12px;font-size:12.8px;color:var(--t2)}
.callout.warn{border-left-color:var(--amber);background:#fffaf0}.callout.red{border-left-color:var(--red);background:#fff6f5}.callout.grn{border-left-color:var(--green);background:#f4fbf6}
.ai{border:1px dashed #cdbff0;background:#faf8ff;border-radius:5px;padding:10px 12px;font-size:12.8px;color:var(--t2)}
.ai p{margin:6px 0 0}
.prog{height:8px;background:#eceef4;border-radius:4px;position:relative;margin:7px 0 4px}
.prog em{display:block;height:100%;background:#a9b6f5;border-radius:4px}
.prog u{position:absolute;top:-3px;width:2px;height:14px;background:var(--navy)}
.bar-h{height:8px;border-radius:4px;background:#eceef4;position:relative;overflow:hidden}
.bar-h i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:4px;transition:width .3s}
/* simulation */
.sliders{display:grid;gap:12px}
.sl label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.sl input[type=range]{width:100%;accent-color:var(--blue)}
.sl .hint{font-size:11.5px;color:var(--t3)}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
.sw input{accent-color:var(--blue);width:15px;height:15px}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-size:12px;color:var(--t3);font-weight:600;border-bottom:1px solid var(--line)}
.cmp td.sep{padding:6px 9px 3px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);border-bottom:0;text-align:left}
.cmp tr.tot td{font-weight:700;border-top:1px solid var(--line);background:#fafafc}
.cmp .pos{color:var(--green2)}.cmp .neg{color:var(--red)}
.lever{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;width:100%}
.lever:hover{border-color:#b6bfe9}.lever.on{border-color:var(--blue);background:#f5f7ff;box-shadow:inset 0 0 0 1px var(--blue)}
.lever.dis{opacity:.55;cursor:not-allowed}
.lever .rd{width:16px;height:16px;border:2px solid #b3b8cb;border-radius:50%;margin-top:2px}.lever.on .rd{border-color:var(--blue);background:radial-gradient(var(--blue) 45%,#fff 50%)}
.lever b{font-size:13.5px}.lever small{display:block;color:var(--t3);font-size:12px;margin-top:2px}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:8px 0;position:relative;font-size:13px}
.step::before{content:"";position:absolute;left:12px;top:32px;bottom:-6px;width:2px;background:#eceef3}.step:last-child::before{display:none}
.step>i{width:26px;height:26px;border-radius:50%;border:2px solid #cfd3de;background:#fff;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:650;color:var(--t3);z-index:1}
.step.done>i{background:var(--green);border-color:var(--green);color:#fff}.step.cur>i{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px rgba(49,82,242,.16)}.step.wait>i{border-color:var(--amber);color:#8a5208;box-shadow:0 0 0 4px rgba(242,179,61,.25)}.step.bad>i{background:var(--red);border-color:var(--red);color:#fff}
.step.todo{opacity:.55}
textarea.msg{width:100%;min-height:118px;border:1px solid #c9ccd8;border-radius:5px;padding:8px 10px;font-size:13px;resize:vertical;line-height:1.45}
.fgrid{display:grid;grid-template-columns:1fr 130px;gap:8px 12px;align-items:center;font-size:13px}
.fgrid input{height:28px;border:1px solid #c9ccd8;border-radius:4px;padding:0 8px;text-align:right;width:100%}
hr.sp{border:0;border-top:1px solid var(--line2);margin:10px 0}
.skel{height:14px;background:linear-gradient(90deg,#eef0f5,#f7f8fb,#eef0f5);background-size:200% 100%;animation:sk 1s linear infinite;border-radius:4px;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#13182e;color:#fff;padding:9px 16px;border-radius:7px;font-size:13px;z-index:200;animation:fade .15s ease;display:flex;gap:8px;align-items:center;max-width:720px}
@keyframes fade{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.batchbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;width:min(1240px,calc(100vw - 48px));display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--blue);border-radius:8px;padding:10px 14px;box-shadow:0 8px 28px rgba(15,18,34,.22);font-size:13px}
.selchip{background:#13182e;color:#fff;border-radius:5px;padding:5px 10px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.selchip button{border:0;background:transparent;color:#fff;padding:0}
.main{display:grid;grid-template-columns:minmax(380px,.82fr) minmax(0,1.3fr);gap:8px;align-items:start}
tr.flash td{animation:flashrow 2.4s ease-out 2}
@keyframes flashrow{0%{background:#fff2cc}100%{background:transparent}}
@media (max-width:1100px){.ws{min-width:0}.main{grid-template-columns:1fr}.pipe{grid-template-columns:repeat(3,1fr)}.ikpis{grid-template-columns:1fr 1fr!important}}
/* ---- partner apps and commercial management (rec3) ---- */
.pbar{display:flex;align-items:center;gap:10px;padding:8px 4px 0}
.ribbon{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:#5a3fc4;background:#f1ecff;border:1px solid #d4c8f5;border-radius:4px;padding:2px 8px}
.pfield{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;font-size:12px;color:var(--t3)}
.pfield select{border:0;background:transparent;font-weight:600;font-size:13px;color:var(--t1);outline:none;cursor:pointer;max-width:260px}
.kcol{background:#f6f7fa;border:1px solid var(--line2);border-radius:6px;padding:8px;min-height:220px}
.kcol h4{margin:2px 4px 8px;font-size:12.5px;display:flex;justify-content:space-between;color:var(--t2)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 10px;margin-bottom:8px;cursor:pointer;font-size:12.6px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.kcard:hover{border-color:#b6bfe9}.kcard.flash{animation:flash 2.2s ease-out 2}
@keyframes flash{0%{box-shadow:0 0 0 3px rgba(49,82,242,.35)}100%{box-shadow:none}}
.kcard b{font-size:13px}.kcard small{color:var(--t3)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--t2)}
.flow span.st{background:#eef0f6;border-radius:5px;padding:4px 10px}
.flow span.ar{color:var(--t4)}
.hbar{display:grid;grid-template-columns:190px 1fr 120px;gap:10px;align-items:center;font-size:12.8px;margin:6px 0;cursor:pointer;border-radius:4px;padding:2px 4px}
.hbar:hover{background:#f6f7fb}
.hbar i{display:block;height:9px;border-radius:5px;background:#eceef4;position:relative;overflow:hidden}
.hbar i em{position:absolute;left:0;top:0;bottom:0;background:#a9b6f5;border-radius:5px}
.tgl{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.sw2{width:34px;height:20px;border-radius:999px;background:#d8dbe6;border:0;position:relative;padding:0;flex:none;transition:background 150ms}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left 150ms}
.sw2.on{background:var(--blue)}.sw2.on::after{left:17px}.sw2:disabled{opacity:.4;cursor:not-allowed}
.scn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scn .c{border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:12.5px;background:#fff}
.scn .c.best{border-color:var(--green);background:#f4fbf6}.scn .c.cur{border-color:var(--blue);background:#f5f7ff}
.scn .c b{display:block;font-size:12px;color:var(--t2);margin-bottom:4px}
.scn .c div{display:flex;justify-content:space-between;gap:6px}
.banner2{display:flex;gap:10px;align-items:center;border:1px solid #bfe3cc;background:#f4fbf6;border-radius:6px;padding:10px 14px;margin:0 0 8px}
.banner2.wait{border-color:#f0d58a;background:#fffaf0}
.banner2 .grow{flex:1}
.mini{display:flex;gap:2px;align-items:flex-end;height:70px}
.mini i{flex:1;background:#a9b6f5;border-radius:3px 3px 0 0;position:relative}
.mini i small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--t3);font-style:normal}
.mini i b{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px;font-weight:600;font-style:normal}
.drawer-grip{position:absolute;left:-6px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:2;display:flex;align-items:center;justify-content:center;touch-action:none}
.drawer-grip i{width:4px;height:44px;border-radius:3px;background:#c4c9da;opacity:0;transition:opacity .15s}
.drawer:hover .drawer-grip i,.drawer-grip.on i{opacity:1}
.drawer-grip:hover i,.drawer-grip.on i{background:var(--blue)}
.xbtn+.xbtn{margin-left:0}.xbtn svg{display:block;margin:auto}
.drawer.nodrag{animation:none}
.tabs2{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:12px 0 10px}
.tabs2 button{border:0;background:transparent;padding:8px 0 7px;font-size:13px;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--t1);font-weight:600;border-bottom-color:var(--blue)}

.ctitle{font-size:14.5px;font-weight:700;margin:0 0 4px;display:flex;gap:8px;align-items:center}
.csub{font-size:12.3px;color:var(--t3);margin:0 0 10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.top{display:flex;gap:10px;align-items:center;margin-bottom:2px;flex-wrap:wrap}.top img{height:20px;display:block}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 4px 10px}
.opt{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:#fff;cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:#b6bfe9}.opt.on{border-color:var(--blue);background:#f5f7ff;box-shadow:inset 0 0 0 1px var(--blue)}
.opt .rd{width:16px;height:16px;border:2px solid #b3b8cb;border-radius:50%;margin-top:2px}.opt.on .rd{border-color:var(--blue);background:radial-gradient(var(--blue) 45%,#fff 50%)}
.opt small{display:block;color:var(--t3);font-size:12px;margin-top:2px}
.tbl-sel tr.sel td{background:#eef1ff}
.t tr.pick td{background:#eef1ff}
.frm2{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center;font-size:13px}
.frm2 input,.frm2 select{height:30px;border:1px solid #c9ccd8;border-radius:4px;padding:0 9px;background:#fff;width:100%}
.pbar{height:6px;border-radius:3px;background:#e7e9f2;width:90px;margin-top:4px}.pbar i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.t tr[data-a=wsgo]{cursor:pointer}.t tr[data-a=wsgo]:hover td{background:#f5f7ff}
.crumbs{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--t3);margin:0 0 6px;flex-wrap:wrap}.crumbs a{color:var(--blue);text-decoration:none}.crumbs a:hover{text-decoration:underline}.crumbs b{color:var(--t1);font-weight:600}
.hero h2{font-weight:700}.plus{display:flex;gap:10px}.plus>div{border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:210px;background:#f7f9ff}.plus span{display:block;font-size:12px;color:var(--t3)}.plus b{font-size:22px;display:block;margin:2px 0}.plus small{color:var(--t3);font-size:11.8px}
.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eef1ff;color:var(--blue);font-weight:700;font-size:12px}
.main2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:8px;align-items:start}
@media (max-width:1100px){.main2{grid-template-columns:1fr}}

.drawer .body{container-type:inline-size}.drawer .main2{grid-template-columns:1fr}.drawer .ikpis{grid-template-columns:1fr 1fr!important}.drawer .plus{flex-wrap:wrap}.drawer table.cmp,.drawer table.t{font-size:12.5px}
.ctx{border:1px solid var(--line);border-radius:8px;background:#f7f9ff}.ctxr{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:13px}.ctxr:last-child{border-bottom:0}.ctxr>b{color:var(--t2);font-weight:650}.ctxr.cond{background:#fffaf0}
@container (min-width:1000px){.drawer .main2{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.drawer .ikpis{grid-template-columns:repeat(4,1fr)!important}}
@media (max-width:1100px){.g2,.g3{grid-template-columns:1fr}.kan{grid-template-columns:1fr 1fr}}
</style>

}
function applyReco(c, batch) {
  const rec = recommendedLever(c), a = mkAction(c, rec, recParams(c, rec)); a.hist[0].t = nowStr();

/* ---------- 2. Parceiros e acordos ---------- */

function incDetail(s) {

function isimUpdate() {

/* ---------- 4. Acompanhamento ---------- */
const KAN = [["aprovacao", "Em aprovação"], ["devolvida", "Devolvidas"], ["liberada", "Liberadas"], ["aceita", "Aceitas pelo parceiro"], ["resultado", "Resultado"]];
function orqHTML() {

/* prioridade da conta por regras: maior nível entre as propostas paradas além do ciclo; dentro do nível, resultado econômico estimado só das recuperáveis */
function wsAcct(st) {
  const cs = wsCases(st), stalled = cs.filter((c) => classify(c).cat === "comercial"), rec = stalled.length ? portfolioEcon(stalled) : { ganho: 0, margem: 0 };
  const top = stalled.reduce((m, c) => Math.max(m, tierOf(c).rank), 0), nAlta = stalled.filter((c) => tierOf(c).nivel === "alta").length;
  const p1 = stalled.length ? portfolioEcon(stalled.slice(0, 1)) : null, p2 = stalled.length > 1 ? portfolioEcon(stalled.slice(0, 2)) : null;
  const acts = ST.actions.filter((a) => byId(a.caseId).store === st.id && a.status !== "resultado");
  const contacts = ST.actions.filter((a) => byId(a.caseId).store === st.id).flatMap((a) => a.contacts || []);
  return { st, cs, stalled, rec, top, nAlta, p1, p2, gap: tierGap(st), ctrl: st.group === "controle", elig: stalled.filter(productElig), rel: acts.filter((a) => a.status === "liberada").length, apr: acts.filter((a) => a.status === "aprovacao").length, last: contacts.length ? contacts[contacts.length - 1].t : null };
}
const wsRanked = () => STORES.filter((s) => ["FI", "REV"].includes(s.model) && (S.f.model === "todos" || S.f.model === s.model)).map(wsAcct).sort((a, b) => (a.ctrl - b.ctrl) || (b.top - a.top) || (b.rec.margem - a.rec.margem));

/* abordagem consolidada: o comercial negocia a relação com a conta, não cada proposta isolada */
function wsConsolScript(st, cs) {
  const stalled = cs.filter((c) => classify(c).cat === "comercial"), N = stalled.length, nt = st.agr.tiers.find(([n]) => n > st.agr.done), gap = tierGap(st), L = WL[st.model], elig = stalled.filter(productElig);

  lines.push(nt && gap <= N ? `A ${L.conta} está a ${gap} contrato${gap > 1 ? "s" : ""} da faixa de ${nt[0]} do acordo, que libera ${fmtBRL(bundleBonus(st, gap))} de bônus de meta (pago uma vez, a confirmar a vigência).` : `Hoje essas propostas não levam a ${L.conta} à próxima faixa (faltam ${gap}), mas somam ${fmtBRL(wsRetOf(stalled))} de retorno.`);

}

function wsArgHTML(st, cs) {
  const rev = st.model === "REV", ag = st.agr, nt = ag.tiers.find(([n]) => n > ag.done), stalled = cs.filter((c) => classify(c).cat === "comercial"), pool = stalled.length ? stalled : cs, N = pool.length, need = nt ? nt[0] - ag.done : 0, L = WL[st.model];

  wssolicitar: () => {
    const c = byId(W.caseId), prev = openActionOf(c.id), inherited = prev && LIGHT.includes(prev.lever) ? (prev.contacts || []).slice() : [];
    if (prev && LIGHT.includes(prev.lever)) { prev.status = "resultado"; prev.outcome = "substituida"; logA(prev, "Substituída por outra intervenção após o relato registrado no contato"); }
    const a = mkAction(c, W.lever, W.sim, { msg: $("#wmsg").value }); a.hist[0].t = nowStr(); a.hist[0].text = "Ação definida no workspace após relato registrado no contato"; a.contacts = inherited;
    logA(a, a.approvals.length ? `Enviada para aprovação: ${a.approvals.map((x) => ROLES[x.role]).join(", ")}` : "Liberada para abordagem"); ST.actions.push(a); save(); W.lever = null; W.sim = null; W.msgEdited = false; wsRefresh(); toast(`${a.id} enviada para aprovação. Acompanhe em Acompanhamento.`);
  },
  wsregistrar: () => {
    const c = byId(W.caseId), st = storeOf(c), k = W.ct, R = WL[st.model].resp; let a = openActionOf(c.id);
    if (a && a.status === "aprovacao" && k.resposta === R[1]) { toast("A condição ainda está em aprovação: aguarde a liberação antes de registrar o aceite"); return; }
    if (!a) { const l = recommendedLever(c); a = mkAction(c, LIGHT.includes(l) ? l : "acompanhamento", origParams(c)); a.hist[0].t = nowStr(); logA(a, `${LEVERS[a.lever].label} liberada para abordagem`); ST.actions.push(a); }
    const taxa = parseFloat(k.taxa), relato = k.motivo.startsWith("Cliente tem oferta") ? { tipo: "preco", taxa: isNaN(taxa) ? null : taxa } : k.motivo.startsWith("Parcela") ? { tipo: "parcela" } : null;
    OPS.contact(a, { t: nowStr(), canal: WCH[k.canal], com: `${st.user[0]} (${st.user[1]})`, resposta: k.resposta, motivo: k.motivo, proximo: k.proximo });
    if (relato) ST.relatos[c.id] = { ...relato, quem: `${st.user[1]} ${st.name} (${st.user[0]})`, quando: TODAY_STR };
    if (k.resposta === R[1] && a.status === "liberada") OPS.accept(a);
    if (k.resposta === R[3]) OPS.decline(a, k.motivo === "Não informado" ? "Recusa sem motivo informado" : k.motivo);
    save(); wsResetCt(st); W.sim = null; W.lever = null; W.msgEdited = false; wsRefresh();
    toast(relato ? "Contato registrado. O relato libera a segunda etapa (preço ou crédito), depois de validado." : "Contato registrado.");
  },
});
document.addEventListener("input", (e) => {
  const t = e.target, k = t.dataset.input;
  if (k === "wsim") { W.sim[t.dataset.k] = +t.value; wsUpdate(); }
  if (k === "wmsg") W.msgEdited = true;
  if (k === "wprod") { W.sim[t.dataset.k] = t.checked; wsUpdate(); }
  if (k === "wct") { W.ct[t.dataset.k] = t.value; if (t.dataset.k === "motivo") wsRefresh(); }
});
window.addEventListener("hashchange", wsRoute);

loadState();
(function deepLink() { const m = location.hash.match(/#acao=(AC-\d+)/); if (m && actionById(m[1])) S.tab = "orq"; if (/conta=/.test(location.hash)) wsRoute(); else render(); if (m && actionById(m[1])) { S.flash = m[1]; actDrawer(m[1]); } })();
</script>
